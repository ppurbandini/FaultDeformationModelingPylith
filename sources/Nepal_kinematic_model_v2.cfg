[pylithapp]

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.timedependent.formulation.time_step]
total_time = 0*s
dt = 0.05*s

[pylithapp.mesh_generator.reader]
filename = mesh/Nepal_planar_grid_mesh-2000-planar.exo

# Materials
[pylithapp.timedependent.materials.left]
db_properties.iohandler.filename = spatialdb/mat_concrust_1D.spatialdb
db_properties.query_type=linear
[pylithapp.timedependent.materials.right]
db_properties.iohandler.filename = spatialdb/mat_concrust_1D.spatialdb
db_properties.query_type=linear


# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.timedependent]
bc = [west,south,east,north,bottom]

[pylithapp.timedependent.bc.west]
bc_dof = [0]
db_initial.label = Dirichlet BC on west
label = westB
[pylithapp.timedependent.bc.south]
label = southB
bc_dof = [1]
db_initial.label = Dirichlet BC on west
[pylithapp.timedependent.bc.east]
label = eastB
bc_dof = [0]
db_initial.label = Dirichlet BC on west
[pylithapp.timedependent.bc.north]
label = northB
bc_dof = [1]
db_initial.label = Dirichlet BC on west
[pylithapp.timedependent.bc.bottom]
label = botB
bc_dof = [2]
db_initial.label = Dirichlet BC on west

# ----------------------------------------------------------------------
# faults
# ----------------------------------------------------------------------
[pylithapp.timedependent]
interfaces = [fault]

# Set the type of fault interface condition.
[pylithapp.timedependent.interfaces]
fault = pylith.faults.FaultCohesiveKin

# Set the parameters for the fault interface condition.
[pylithapp.timedependent.interfaces.fault]
# The label corresponds to the name of the nodeset in CUBIT.
label = fault
edge = fault_edge

# We must define the quadrature information for fault cells.
# The fault cells are 1D (line).
quadrature.cell = pylith.feassemble.FIATSimplex
quadrature.cell.dimension = 2

# The slip time and final slip are defined in spatial databases.
[pylithapp.timedependent.interfaces.fault.eq_srcs.rupture.slip_function]
slip.iohandler.filename = spatialdb/Slip_distribution.spatialdb
slip.query_type = linear
slip.label = Final slip

# Slip time is uniform, so use UniformDB for convenience
slip_time = spatialdata.spatialdb.UniformDB
slip_time.label = Slip time
slip_time.values = [slip-time]
slip_time.data = [0.0*year]


# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem.formulation]
output = [domain,station]
output.station = pylith.meshio.OutputSolnPoints

# Domain
[pylithapp.problem.formulation.output.domain]
writer.filename = output/v2/Nepal_kinematic_model.h5

# station
[pylithapp.timedependent.formulation.output.station]
#reader = pylith.meshio.PointsList
writer = pylith.meshio.DataWriterHDF5
reader.filename = nodeslist
writer.filename = output/v2/Nepal_kinematic_model-station.h5
coordsys.space_dim = 3
coordsys.units = km


# Faults
[pylithapp.timedependent.interfaces.fault.output]
#writer = pylith.meshio.DataWriterHDF5SubSubMesh
writer = pylith.meshio.DataWriterHDF5
writer.filename = output/v2/Nepal_kinematic_model-fault.h5

# Materials
[pylithapp.timedependent.materials.left.output]
writer.filename = output/v2/Nepal_kinematic_model-left.h5

[pylithapp.timedependent.materials.right.output]
writer.filename = output/v2/Nepal_kinematic_model-right.h5


# End of file
